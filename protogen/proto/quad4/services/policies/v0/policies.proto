syntax = "proto3";

package quad4.services.policies.v0;

option go_package = "github.com/Quad4-Software/cloud/protogen/gen/quad4/service/policies/v0";

import "quad4/messages/policies/v0/policies.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "google/api/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Quad4 Cloud policies";
    version: "1.0.0";
    contact: {
      name: "Quad4 Cloud GmbH";
      url: "https://github.com/Quad4-Software/cloud";
      email: "support@quad4.io";
    };
    license: {
      name: "Apache-2.0";
      url: "https://github.com/Quad4-Software/cloud/blob/main/LICENSE";
    };
  };
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  external_docs: {
    description: "Developer Manual";
    url: "https://github.com/Quad4-Software/cloud/services/policies/";
  };
};

service policiesProvider {
	rpc Evaluate(EvaluateRequest) returns (EvaluateResponse) {
    option (google.api.http) = {
        post: "/api/v0/policies/evaluate",
        body: "*"
    };
  };
}

message EvaluateRequest {
  string query = 1;
  quad4.messages.policies.v0.Environment environment = 2;
}

message EvaluateResponse {
  bool result = 1;
}
