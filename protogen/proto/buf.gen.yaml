version: v1
plugins:
  - name: go
    path: ../../.bingo/protoc-gen-go
    out: ../gen/
    opt:
      - paths=source_relative

  - name: go-grpc
    path: ../../.bingo/protoc-gen-go-grpc
    out: ../gen/
    opt:
      - paths=source_relative

  - name: micro
    path: ../../.bingo/protoc-gen-micro
    out: ../gen/
    opt:
      - paths=source_relative

  - name: microweb
    path: ../../.bingo/protoc-gen-microweb
    out: ../gen/
    opt:
      - paths=source_relative
      - "ignore_packages=\
         quad4.services.thumbnails.v0;\
         quad4.messages.thumbnails.v0;\
         quad4.services.store.v0;\
         quad4.messages.store.v0;\
         quad4.services.eventhistory.v0;\
         quad4.messages.eventhistory.v0;\
         quad4.services.policies.v0;\
         quad4.messages.policies.v0;\
         quad4.services.search.v0;\
         quad4.messages.search.v0"

  - name: openapiv2
    path: ../../.bingo/protoc-gen-openapiv2
    out: ../gen/
