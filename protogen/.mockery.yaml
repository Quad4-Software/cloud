# maintain v2 separate mocks dir
dir: "{{.InterfaceDir}}/mocks"
structname: "{{.InterfaceName}}"
filename: "{{.InterfaceName | snakecase }}.go"
pkgname: mocks

template: testify
include-auto-generated: true
packages:
  github.com/Quad4-Software/cloud/protogen/gen/quad4/services/eventhistory/v0:
    interfaces:
      EventHistoryService: {}
  github.com/Quad4-Software/cloud/protogen/gen/quad4/services/policies/v0:
    interfaces:
      PoliciesProviderService: {}
  github.com/Quad4-Software/cloud/protogen/gen/quad4/services/search/v0:
    interfaces:
      SearchProviderService: {}
  github.com/Quad4-Software/cloud/protogen/gen/quad4/services/settings/v0:
    interfaces:
      ValueService: {}
