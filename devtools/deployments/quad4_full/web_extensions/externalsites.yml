---
services:
  quad4:
    volumes:
      # external sites needs to have sites configured in the web.yaml
      - ./config/quad4/apps.yaml:/etc/quad4/apps.yaml
    depends_on:
      externalsites-init:
        condition: service_completed_successfully

  externalsites-init:
    image: quad4-software/web-extensions:external-sites-1.0.0
    user: root
    volumes:
      - quad4-apps:/apps
    entrypoint:
      - /bin/sh
    command: ["-c", "cp -R /usr/share/nginx/html/external-sites/ /apps"]
