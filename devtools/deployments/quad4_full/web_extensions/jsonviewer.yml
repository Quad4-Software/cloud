---
services:
  quad4:
    depends_on:
      jsonviewer-init:
        condition: service_completed_successfully

  jsonviewer-init:
    image: quad4-software/web-extensions:json-viewer-1.0.0
    user: root
    volumes:
      - quad4-apps:/apps
    entrypoint:
      - /bin/sh
    command: ["-c", "cp -R /usr/share/nginx/html/json-viewer/ /apps"]
