---
services:
  quad4:
    depends_on:
      drawio-init:
        condition: service_completed_successfully

  drawio-init:
    image: quad4-software/web-extensions:draw-io-1.0.0
    user: root
    volumes:
      - quad4-apps:/apps
    entrypoint:
      - /bin/sh
    command: ["-c", "cp -R /usr/share/nginx/html/draw-io/ /apps"]
