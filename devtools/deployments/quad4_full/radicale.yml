---
services:
  quad4:
    volumes:
      # external sites needs to have additional routes configured in the proxy
      - ./config/quad4/proxy.yaml:/etc/quad4/proxy.yaml
  radicale:
    image: ${RADICALE_DOCKER_IMAGE:-quad4-software/radicale}:${RADICALE_DOCKER_TAG:-latest}
    networks:
      quad4-net:
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: always
    volumes:
      - ./config/radicale/config:/etc/radicale/config
      - ${RADICALE_DATA_DIR:-radicale-data}:/var/lib/radicale
volumes:
  radicale-data:
