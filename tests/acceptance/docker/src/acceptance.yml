services:
  acceptance-tests:
    image: quad4-software/php-alpine-ci:8.4
    working_dir: /woodpecker/src/github.com/Quad4-Software/cloud
    command: /bin/bash /test/run-tests.sh
    environment:
      OC_ROOT: /woodpecker/src/github.com/Quad4-Software/cloud
      TEST_SERVER_URL: ${TEST_SERVER_URL:-https://quad4-server:9200}
      OC_WRAPPER_URL: http://quad4-server:5200
      STORAGE_DRIVER: ${STORAGE_DRIVER:-posix}
      BEHAT_SUITE: ${BEHAT_SUITE:-}
      BEHAT_FEATURE: ${BEHAT_FEATURE:-}
      OC_BASE_DATA_PATH: ${OC_BASE_DATA_PATH:-/var/lib/quad4}
      USE_BEARER_TOKEN: ${USE_BEARER_TOKEN:-false}
      # email
      EMAIL_HOST: email
      EMAIL_PORT: 9000
    env_file:
      - ../../../../.woodpecker.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./run-tests.sh:/test/run-tests.sh
      - ../../../../:/woodpecker/src/github.com/Quad4-Software/cloud
      - ../../../../vendor-bin/behat/composer.json:/tmp/vendor-bin/behat/composer.json
